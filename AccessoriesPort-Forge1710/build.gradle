buildscript {
    repositories {
        mavenCentral()
        maven {
            name = 'forge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            url = 'https://jitpack.io'
        }
    }
    dependencies {
        classpath 'com.github.GTNewHorizons:ForgeGradle:1.2.11'
    }
}
apply plugin: 'forge'

version = '0.1.0-dev'
group = 'com.example.accessoriesport'
archivesBaseName = 'AccessoriesPort-1.7.10'

sourceCompatibility = 1.7
targetCompatibility = 1.7

minecraft {
    version = '1.7.10-10.13.4.1614-1.7.10'
    runDir = 'run'
}

repositories {
    mavenCentral()
}
