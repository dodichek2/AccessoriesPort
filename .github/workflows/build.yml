name: Build AccessoriesPort (Forge 1.7.10)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'AccessoriesPort-Forge1710/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '8'

      - name: Set up Gradle 4.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.4.1'
          cache-disabled: true

      - name: Build mod
        working-directory: AccessoriesPort-Forge1710
        run: gradle --no-daemon setupDecompWorkspace build --stacktrace

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: AccessoriesPort-Forge1710-build
          path: AccessoriesPort-Forge1710/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
