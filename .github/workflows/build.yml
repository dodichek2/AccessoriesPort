name: Build AccessoriesPort (Forge 1.7.10)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'AccessoriesPort-Forge1710-source.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract source archive
        run: |
          test -f AccessoriesPort-Forge1710-source.zip
          unzip -q AccessoriesPort-Forge1710-source.zip -d source
          test -f source/AccessoriesPort-Forge1710/build.gradle

      - name: Set up Gradle 2.14.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '2.14.1'
          cache-disabled: true

      - name: Build mod
        working-directory: source/AccessoriesPort-Forge1710
        run: gradle --no-daemon clean build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: AccessoriesPort-Forge1710-build
          path: source/AccessoriesPort-Forge1710/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
